name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply source bundles
        shell: bash
        run: |
          set -euo pipefail
          cat deploy/v3-text-b64/*.txt | tr -d '\n' | base64 -d > /tmp/v3-text.tar.gz
          echo '88114492c1e773be2100db036ca0115ef073f29c18752446fb72c774f6fd4256  /tmp/v3-text.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v3-text.tar.gz
          python3 scripts/apply_v4_patch.py

          cat deploy/v5-payload/*.txt | tr -d '\n' | base64 -d > /tmp/v5-payload.tar.gz
          echo '03b7422aad7eb7bca8b31e2e3bbcc9f1316a74321a33e86651c0ffabbc97a84f  /tmp/v5-payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v5-payload.tar.gz
          python3 scripts/apply_v5_patch.py

      - name: Prepare media and technical documents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets datasheets
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36'

          # External sources are used only in CI. Public pages receive same-origin local files.
          curl -L --fail --retry 3 --retry-delay 2 -A "$UA" \
            'https://images.pexels.com/videos/30482723/pexels-photo-30482723.jpeg?auto=compress&dpr=1&h=1080&w=1920' \
            -o assets/hero-real.jpg

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          curl -L --fail --retry 3 --retry-delay 2 -A "$UA" \
            'https://videos.pexels.com/video-files/14534442/14534442-uhd_3840_2160_30fps.mp4' \
            -o /tmp/hero-source.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 0 -t 8 -i /tmp/hero-source.mp4 \
            -vf "scale=960:-2,fps=20" -an -c:v libx264 -preset medium -b:v 1100k -maxrate 1300k -bufsize 2600k -pix_fmt yuv420p \
            -movflags +faststart assets/hero-loop.mp4

          curl -L --fail --retry 3 --retry-delay 2 -A "$UA" \
            'https://images.pexels.com/photos/3190370/pexels-photo-3190370.jpeg?cs=srgb&dl=pexels-hikaique-3190370.jpg&fm=jpg' \
            -o assets/transporte-v2.jpg
          curl -L --fail --retry 3 --retry-delay 2 -A "$UA" \
            'https://images.pexels.com/photos/7195123/pexels-photo-7195123.jpeg?cs=srgb&fm=jpg' \
            -o assets/saude-real.jpg
          curl -L --fail --retry 3 --retry-delay 2 -A "$UA" \
            'https://images.pexels.com/photos/11340705/pexels-photo-11340705.jpeg?cs=srgb&fm=jpg' \
            -o assets/defesa-civil-real.jpg

          # Approved CCO/Education media are reconstructed byte-for-byte.
          cat assets/cco-data/00.txt assets/cco-data/01.txt assets/cco-data/02.txt assets/cco-data/03.txt \
              assets/cco-data/04.txt assets/cco-data/05.txt assets/cco-data/06.txt | base64 -d > assets/cco-final.jpg
          echo '652ae853b0c2ecdd859a823b1eb9f883978c977a22014c6c54685b0234fc1288  assets/cco-final.jpg' | sha256sum -c -

          cat assets/educacao-v3-data/00.txt assets/educacao-v3-data/01.txt assets/educacao-v3-data/02.txt \
              assets/educacao-v3-data/03a.txt assets/educacao-v3-data/03b.txt assets/educacao-v3-data/03c.txt \
              assets/educacao-v3-data/04.txt assets/educacao-v3-data/05.txt assets/educacao-v3-data/06.txt | base64 -d > assets/educacao-final-v3.jpg
          echo 'aae850f7871e1e5caf0954846ff92d49b57311cc8049bfa68146955cd60678db  assets/educacao-final-v3.jpg' | sha256sum -c -

          python3 -m pip install --disable-pip-version-check --quiet reportlab pillow pypdf
          python3 - <<'PYIMG'
          from PIL import Image, ImageOps, ImageFilter
          from pathlib import Path
          A=Path('assets')

          # Normalize provider media first.
          for name in ['hero-real.jpg','transporte-v2.jpg','saude-real.jpg','defesa-civil-real.jpg']:
              p=A/name
              im=Image.open(p).convert('RGB')
              im.thumbnail((1800,1400),Image.Resampling.LANCZOS)
              im.save(p,'JPEG',quality=86,optimize=True,progressive=False)

          def fit(src,dst,centering=(.5,.5)):
              im=Image.open(A/src).convert('RGB')
              out=ImageOps.fit(im,(1600,900),Image.Resampling.LANCZOS,centering=centering)
              out.save(A/dst,'JPEG',quality=88,optimize=True,progressive=False)

          def portrait_comp(src,dst,focus=(.5,.5)):
              im=Image.open(A/src).convert('RGB')
              bg=ImageOps.fit(im,(1600,900),Image.Resampling.LANCZOS,centering=focus).filter(ImageFilter.GaussianBlur(28))
              bg=Image.blend(bg,Image.new('RGB',bg.size,(0,0,0)),.18)
              fg=im.copy(); fg.thumbnail((1550,850),Image.Resampling.LANCZOS)
              bg.paste(fg,((1600-fg.width)//2,(900-fg.height)//2))
              bg.save(A/dst,'JPEG',quality=88,optimize=True,progressive=False)

          fit('cco-final.jpg','cco-display.jpg')
          fit('educacao-final-v3.jpg','educacao-display.jpg',(.48,.5))
          fit('transporte-v2.jpg','transporte-display.jpg',(.52,.48))
          fit('saude-real.jpg','saude-display.jpg',(.55,.5))
          portrait_comp('defesa-civil-real.jpg','defesa-display.jpg')
          PYIMG

          python3 scripts/build_v5_documents.py

      - name: Validate V5 public site
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/hero-loop.mp4
          test -s assets/hero-real.jpg
          test -s assets/ecossistema-urban-brain.svg
          test -s assets/gis-operacional-urban-brain.svg
          for img in cco-display educacao-display transporte-display saude-display defesa-display; do
            test -s "assets/${img}.jpg"
          done
          file assets/hero-loop.mp4 | grep -Eiq 'ISO Media|MP4|MPEG'
          test "$(stat -c%s assets/hero-loop.mp4)" -lt 5000000

          test -s URBAN-BRAIN-Manual-Tecnico-Geral.pdf
          test -s URBAN-BRAIN-Apresentacao-Executiva.pdf
          for f in cco-seguranca educacao-escolas transporte-publico saude-digital telegestao-defesa-civil; do
            test -s "datasheets/${f}.pdf"
          done

          ! grep -R -Eiq 'pexels\.com|pixabay\.com|fonts\.googleapis\.com|fonts\.gstatic\.com' index.html modulos assets/styles.css assets/script.js
          ! grep -R -Eiq 'R3S|Patric Andrade|CITSUP' index.html modulos assets/styles.css assets/script.js
          ! grep -R -Eiq 'M[ÓO]DULO[[:space:]]+[0-9]+' index.html modulos

          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import xml.etree.ElementTree as ET
          from PIL import Image
          from pypdf import PdfReader

          class P(HTMLParser): pass
          public=[Path('index.html'), *Path('modulos').glob('*.html')]
          for f in public:
              P().feed(f.read_text(encoding='utf-8'))
          ET.parse('assets/ecossistema-urban-brain.svg')
          ET.parse('assets/gis-operacional-urban-brain.svg')

          html=Path('index.html').read_text(encoding='utf-8')
          assert 'Manual técnico completo da plataforma' in html
          assert 'URBAN-BRAIN-Manual-Tecnico-Geral.pdf' in html
          for f in Path('modulos').glob('*.html'):
              txt=f.read_text(encoding='utf-8')
              assert 'Características da solução' in txt
              assert 'Especificações consolidadas' in txt

          for name in ['cco-display.jpg','educacao-display.jpg','transporte-display.jpg','saude-display.jpg','defesa-display.jpg']:
              im=Image.open(Path('assets')/name); im.load()
              assert im.size==(1600,900), (name,im.size)

          manual=PdfReader('URBAN-BRAIN-Manual-Tecnico-Geral.pdf')
          assert len(manual.pages)>=50, len(manual.pages)
          for f in ['cco-seguranca','educacao-escolas','transporte-publico','saude-digital','telegestao-defesa-civil']:
              r=PdfReader(f'datasheets/{f}.pdf')
              assert len(r.pages)>=6, (f,len(r.pages))
          print('V5 validation OK:',len(manual.pages),'manual pages; 6+ pages per datasheet; 1600x900 display images')
          PY

      - name: Assemble public artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets _site/modulos _site/datasheets
          cp index.html robots.txt sitemap.xml URBAN-BRAIN-Apresentacao-Executiva.pdf URBAN-BRAIN-Manual-Tecnico-Geral.pdf _site/
          cp modulos/*.html _site/modulos/
          cp datasheets/*.pdf _site/datasheets/
          cp assets/styles.css assets/script.js assets/urban-brain-wordmark.jpg \
             assets/hero-real.jpg assets/hero-loop.mp4 \
             assets/cco-display.jpg assets/educacao-display.jpg assets/transporte-display.jpg \
             assets/saude-display.jpg assets/defesa-display.jpg \
             assets/ecossistema-urban-brain.svg assets/gis-operacional-urban-brain.svg _site/assets/

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
